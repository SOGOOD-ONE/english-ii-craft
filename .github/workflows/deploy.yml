name: Deploy English-II-Craft to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 官方 GitHub Pages deploy 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 一个部署完成才运行下一次
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 触发 next.config 里 basePath='/english-ii-craft' + output='export'
      GITHUB_PAGES_DEPLOY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site (Next.js export)
        run: npm run build
        # Next output:'export' 会把产物写 ./out

      - name: SPA fallback: copy index.html → 404.html (GitHub Pages 404 会加载主站,走客户端路由)
        run: cp out/index.html out/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
